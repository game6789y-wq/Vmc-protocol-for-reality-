name: Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and verify Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK_SIGNATURE_VERIFICATION=PASSED" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: vmc-protocol-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## VMC Protocol Android test build"
            echo "- Variant: Debug"
            echo "- Signing: Android debug certificate (test only)"
            echo "- Public GitHub Release: not created by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
