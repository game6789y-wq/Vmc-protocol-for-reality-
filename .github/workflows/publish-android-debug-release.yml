name: Publish Android Debug Test Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-debug-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, verify, and publish test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-debug
          name: "VMC Protocol Android v0.1.0 (Debug Test)"
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## Android Debug Test Build

            This is a **pre-release for testing only**. It is signed with the Android debug certificate and is not a production-signed build.

            **Important:** The current Android app is a minimal VMC-themed status/test shell. It does not yet implement the complete VMC protocol features, OSC transport, streaming, or 3D control UI.

            The APK signature is verified by the build workflow. See the attached SHA-256 checksum file to verify the downloaded APK.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
